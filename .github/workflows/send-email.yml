name: Send SA Energy Briefing Email

on:
  push:
    paths:
      - briefing.txt

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send email via Gmail
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_email.py

