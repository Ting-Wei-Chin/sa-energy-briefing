name: Send SA Energy Briefing Email

on:
  push:
    paths:
      - briefing.txt

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 send_email.py

